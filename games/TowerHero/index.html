<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tower Hero - Vertical Jumping Game | Arcadia Games</title>

    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Jump your way up the tower in Tower Hero! Timing-based vertical platformer with beautiful graphics. Tap to jump at the perfect moment!">
    <meta name="keywords"
        content="tower hero, jumping game, vertical platformer, timing game, endless jumper, arcade game, casual game, mobile game, free game">
    <meta name="author" content="Arcadia Games">
    <meta name="robots" content="index, follow">

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Tower Hero - Vertical Jumping Game">
    <meta property="og:description"
        content="Jump your way up the tower! Timing-based vertical platformer with perfect moment gameplay.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Arcadia Games">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Tower Hero - Vertical Jumping Game">
    <meta name="twitter:description" content="Jump your way up the tower! Timing-based vertical platformer.">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../common.css">
    <style>
        :root {
            --sky-top: #87CEEB;
            --sky-bottom: #E0F6FF;
            --text-color: #ffffff;
            --text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-canvas {
            display: block;
            background-color: transparent;
        }

        .perfect-text {
            position: absolute;
            font-size: 1.5rem;
            font-weight: 600;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
            transform: translate(-50%, 20px);
            pointer-events: none;
            z-index: 10;
        }

        .perfect-text.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }
    </style>
</head>

<body>

    <canvas id="game-canvas"></canvas>
    <!-- Perfect indicator will be injected by script -->

    <script src="../../game-manager.js"></script>
    <script src="script.js"></script>
</body>

</html>
