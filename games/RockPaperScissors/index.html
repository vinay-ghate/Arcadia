<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors - Play Against Computer | Arcadia Games</title>

    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Play Rock Paper Scissors online against the computer! Classic hand game with fun emojis. Beat the AI and win! Free browser game.">
    <meta name="keywords"
        content="rock paper scissors, rps, hand game, classic game, computer opponent, casual game, fun game, free game, quick game">
    <meta name="author" content="Arcadia Games">
    <meta name="robots" content="index, follow">

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Rock Paper Scissors - Play Against Computer">
    <meta property="og:description" content="Play the classic Rock Paper Scissors game online against the computer!">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Arcadia Games">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Rock Paper Scissors - Play Against Computer">
    <meta name="twitter:description" content="Play the classic Rock Paper Scissors game online against the computer!">

    <link rel="stylesheet" href="../../common.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-container">
        <div class="header">
            <h1>Rock Paper Scissors</h1>
            <p>Choose your weapon!</p>
        </div>

        <div class="choices">
            <button class="choice-btn" data-choice="rock">
                <div class="emoji">🪨</div>
                <div class="label">Rock</div>
            </button>
            <button class="choice-btn" data-choice="paper">
                <div class="emoji">📄</div>
                <div class="label">Paper</div>
            </button>
            <button class="choice-btn" data-choice="scissors">
                <div class="emoji">✂️</div>
                <div class="label">Scissors</div>
            </button>
        </div>

        <div class="result-area" id="result-area">
            <div class="player-choice">
                <span id="player-emoji">❓</span>
                <p>You</p>
            </div>
            <div class="vs">VS</div>
            <div class="computer-choice">
                <span id="computer-emoji">❓</span>
                <p>Computer</p>
            </div>
        </div>

        <div class="message" id="message">Make your move!</div>
    </div>

    <script src="../../game-manager.js"></script>
    <script src="script.js"></script>
</body>

</html>
