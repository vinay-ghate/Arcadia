<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schulte Table - Brain Training & Focus Game | Arcadia Games</title>

    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Train your brain with Schulte Table! Improve focus, concentration, and speed reading. Find numbers in sequence as fast as possible. 3x3 to 9x9 grids!">
    <meta name="keywords"
        content="schulte table, brain training, cognitive training, focus game, concentration game, speed reading, memory game, brain game, educational game">
    <meta name="author" content="Arcadia Games">
    <meta name="robots" content="index, follow">

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Schulte Table - Brain Training & Focus Game">
    <meta property="og:description"
        content="Improve focus and concentration! Train your brain with Schulte Table exercises.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Arcadia Games">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Schulte Table - Brain Training & Focus Game">
    <meta name="twitter:description"
        content="Improve focus and concentration! Train your brain with Schulte Table exercises.">

    <link rel="stylesheet" href="../../common.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <script src="../../game-manager.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>Schulte Table 🧠</h1>
            <p>Find numbers in order. Click '1' to start the timer.</p>
        </header>
        <!-- Back button handled by GameManager -->

        <div class="game-wrapper">
            <aside class="sidebar desktop-only" id="level-selector-desktop">
                <nav>
                    <ul>
                        <li><strong>Choose Level</strong></li>
                    </ul>
                    <ul>
                        <li><a href="#" class="level-btn" data-size="3">3 x 3</a></li>
                        <li><a href="#" class="level-btn" data-size="4">4 x 4</a></li>
                        <li><a href="#" class="level-btn active" data-size="5">5 x 5</a></li>
                        <li><a href="#" class="level-btn" data-size="6">6 x 6</a></li>
                        <li><a href="#" class="level-btn" data-size="7">7 x 7</a></li>
                        <li><a href="#" class="level-btn" data-size="8">8 x 8</a></li>
                        <li><a href="#" class="level-btn" data-size="9">9 x 9</a></li>
                    </ul>
                </nav>
            </aside>

            <main id="game-area">
                <select id="level-selector-mobile" class="mobile-only"
                    style="margin-bottom: 1rem; padding: 0.5rem; border-radius: 8px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2);">
                    <option value="3">Level: 3 x 3</option>
                    <option value="4">Level: 4 x 4</option>
                    <option value="5" selected>Level: 5 x 5</option>
                    <option value="6">Level: 6 x 6</option>
                    <option value="7">Level: 7 x 7</option>
                    <option value="8">Level: 8 x 8</option>
                    <option value="9">Level: 9 x 9</option>
                </select>

                <div id="grid-container"></div>
                <div id="next-number-hint">1</div>
            </main>

            <aside class="sidebar" id="game-info">
                <!-- Time handled by GameManager -->
                <div class="info-box">
                    <h3>Next</h3>
                    <h2 id="next-number">1</h2>
                </div>
                <button id="reset-btn" class="game-button">Reset</button>
                <button id="toggle-highlight-btn" class="game-button" data-enabled="true">Highlight: Off</button>
            </aside>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
